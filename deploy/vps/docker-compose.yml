# UC Model Fixer dashboard on the Corllenium VPS (srv1866850.hstgr.cloud), view only.
# Lives in /docker/uc-fixer on the box. Touches no other stack: its own network for the database
# and API, and only the web container joins Traefik's network (n8n_default), which gives it
# https://uc-fixer.srv1866850.hstgr.cloud with a Let's Encrypt certificate.
# Rollback: `docker compose down` here, then remove /docker/uc-fixer.
name: uc-fixer

networks:
  proxy:
    external: true
    name: n8n_default
  internal: {}

volumes:
  uc_fixer_db: {}

services:
  db:
    image: postgres:16-alpine
    container_name: uc-fixer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fixer
      POSTGRES_PASSWORD: fixer      # reachable only on the internal network; no port is published
      POSTGRES_DB: fixer
    volumes:
      - uc_fixer_db:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixer -d fixer"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    image: ucmodelfixer-api:vps
    container_name: uc-fixer-api
    restart: unless-stopped
    environment:
      FIXER_DATABASE_URL: postgresql+psycopg://fixer:fixer@uc-fixer-db:5432/fixer
      FIXER_DATA_DIR: /app/data
      FIXER_SOURCE_DIR: /app/data/source
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # The Jev decision service. NO published port: only nginx (uc-fixer-web) reaches it on the internal network, and
  # nginx sets X-Remote-User from the login and replaces any value the client sends. Jev is off by default.
  # decide.env (mode 600, written by the owner on the box, not in git) holds TYPESAFE_API_KEY, and later
  # DECIDE_JEV_ENABLED=true. DECIDE_JEV_ENABLED is deliberately NOT under `environment` below: in Compose,
  # `environment` beats `env_file`, so a "false" there would silently ignore the switch in decide.env.
  # The service's own default is false.
  decide:
    image: ucmodelfixer-decide:vps
    container_name: uc-fixer-decide
    restart: unless-stopped
    env_file: ./decide.env
    environment:
      DECIDE_DATABASE_URL: postgresql://fixer:fixer@uc-fixer-db:5432/fixer
      DECIDE_OWNER_USERS: gab
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  web:
    image: ucmodelfixer-web:vps
    container_name: uc-fixer-web
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./users.htpasswd:/etc/nginx/users.htpasswd:ro
    depends_on: [api]
    networks: [internal, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: n8n_default
      traefik.http.routers.uc-fixer.rule: Host(`uc-fixer.srv1866850.hstgr.cloud`)
      traefik.http.routers.uc-fixer.entrypoints: websecure
      traefik.http.routers.uc-fixer.tls.certresolver: mytlschallenge
      traefik.http.services.uc-fixer.loadbalancer.server.port: "80"
