# UC Model Fixer on the VPS: every request needs the owner's login (users.htpasswd, a bcrypt
# hash the owner writes on the box), and the API is read only. GET and HEAD pass; imports,
# fix runs, error recomputes and verdict writes are refused, so the 2 vCPU box never runs the
# engine. Fixing stays on the owner's PC, which pushes results here.
server {
    listen 80;
    server_name _;

    auth_basic "UC Model Fixer";
    auth_basic_user_file /etc/nginx/users.htpasswd;

    location / {
        root /usr/share/nginx/html/web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_except GET { deny all; }
        proxy_pass http://uc-fixer-api:8190;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
